name: iOS Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for simulator
        run: xcodebuild -project NexusWater.xcodeproj -scheme NexusWater -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO ASSETCATALOG_COMPILER_APPICON_NAME= build
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: NexusWater-Simulator-app
          path: build/Build/Products/Debug-iphonesimulator/NexusWater.app